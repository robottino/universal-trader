# Universal Trader — OCI Compose specification
# Compatible with both `podman compose` and `docker compose`.
#
# Usage:
#   # Start ONLY the interactive Telegram Bot microservice:
#   podman compose --profile telegram up -d
#
#   # Start BOTH the hourly trading scheduler AND the Telegram Bot microservice:
#   podman compose --profile scheduler up -d

x-common-volumes: &common-volumes
  - ./configs:/app/configs:ro
  - ./data_cache:/app/data_cache
  - ./forecast_cache:/app/forecast_cache
  - ./state:/app/state
  - ./reports:/app/reports

services:
  trader:
    image: universal-trader:cpu
    build:
      context: .
      dockerfile: Containerfile
      target: cpu
    env_file:
      - path: .env
        required: false
    volumes: *common-volumes
    restart: "no"

  scheduler:
    image: universal-trader:cpu
    build:
      context: .
      dockerfile: Containerfile
      target: cpu
    profiles: ["scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      UTRADER_CONFIG: ${UTRADER_CONFIG:-configs/bitfinex_portfolio_btc_eth_gold.yaml}
      UTRADER_INTERVAL_SECONDS: ${UTRADER_INTERVAL_SECONDS:-3600}
      UTRADER_TRADE_ARGS: ${UTRADER_TRADE_ARGS:-}
    volumes: *common-volumes
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[scheduler] Running utrader trade --config $${UTRADER_CONFIG} $${UTRADER_TRADE_ARGS}"
          utrader trade --config "$${UTRADER_CONFIG}" $${UTRADER_TRADE_ARGS} || true
          sleep "$${UTRADER_INTERVAL_SECONDS}"
        done
    restart: unless-stopped

  telegram-bot:
    image: universal-trader:cpu
    build:
      context: .
      dockerfile: Containerfile
      target: cpu
    profiles: ["scheduler", "telegram"]
    env_file:
      - path: .env
        required: false
    environment:
      UTRADER_CONFIG: ${UTRADER_CONFIG:-configs/bitfinex_portfolio_btc_eth_gold.yaml}
    volumes: *common-volumes
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec utrader telegram-bot --config "$${UTRADER_CONFIG}"
    restart: unless-stopped
