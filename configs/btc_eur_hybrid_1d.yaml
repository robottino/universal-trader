name: "btc_eur_hybrid_1d"
mode: dry_run

instrument:
  id: "BTC/EUR"
  asset_class: crypto
  base: BTC
  quote_currency: EUR
  calendar: "24/7"
  fractional: true
  min_qty: 0.0001
  qty_step: 0.00001
  min_notional: 5.0
  provider_symbols:
    binance: "BTCEUR"
    bitfinex: "tTESTBTC:TESTEUR"
    yahoo: "BTC-EUR"

data:
  provider: binance
  timeframe: "1d"
  lookback_bars: 512
  price_column: close
  use_cache: true
  features:
    past_only: []
    known_future:
      - "dow_sin"
      - "dow_cos"
      - "month_sin"
      - "month_cos"

forecaster:
  type: timestral
  params:
    model_id: "mistralai/Timestral-123M"
    context_len: 256
    horizon: 5 # 5 giorni
    device: "auto"
    batch_size: 32

strategy:
  type: trend_quantile_risk
  trend_fast_window: 10
  trend_slow_window: 30
  target_vol: 0.08
  tail_quantile: 0.05
  tail_risk_budget: 0.05
  k_risk: 1.0
  rebalance_band: 0.15

risk:
  enforce_market_hours: false
  max_data_age_minutes: 1500
  max_exposure_pct: 0.9
  max_drawdown_pct: 0.25
  fee_model:
    pct: 0.001
    fixed_min: 0.0
  slippage_bps: 5.0
  enable_fee_guard: false
  enable_quantile_stop_loss: true
  trailing_stop_pct: 0.10

broker:
  type: local_paper
  initial_cash: 10000.0

walkforward:
  mode: rolling
  train_bars: 180 # 6 mesi
  test_bars: 90   # 3 mesi
  step_bars: 90
  metric: sharpe_ratio
  min_trades: 2
  initial_cash: 10000.0
  param_grid:
    strategy.trend_fast_window: [10, 15, 20]
    strategy.trend_slow_window: [30, 45, 60]
    strategy.target_vol: [0.10, 0.15, 0.20]
    strategy.tail_risk_budget: [0.06, 0.09, 0.12]
