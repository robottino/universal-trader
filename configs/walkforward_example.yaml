name: "btc_eur_1h_walkforward"
mode: paper

instrument:
  id: "BTC/EUR"
  asset_class: crypto
  base: BTC
  quote_currency: EUR
  calendar: "24/7"
  fractional: true
  min_qty: 0.0001
  qty_step: 0.00001
  min_notional: 5.0
  provider_symbols:
    binance: "BTCEUR"
    yahoo: "BTC-EUR"

data:
  provider: binance
  timeframe: "1h"
  lookback_bars: 2200
  price_column: close
  features:
    past_only: []
    known_future: []

forecaster:
  type: noop
  params:
    model_id: "noop/ema_trend"
    context_len: 720
    horizon: 1

strategy:
  type: ema_trend
  trend_fast_window: 240
  trend_slow_window: 720
  trend_hysteresis_pct: 0.015
  target_weight_bull: 0.98
  rebalance_band: 0.15

risk:
  enforce_market_hours: false
  max_data_age_minutes: 90
  max_exposure_pct: 1.0
  max_drawdown_pct: 0.45
  fee_model:
    pct: 0.0
    fixed_min: 0.0
  slippage_bps: 5.0
  enable_fee_guard: false

broker:
  type: simulated
  initial_cash: 10000.0
  execution_price: next_open

walkforward:
  mode: rolling # rolling | expanding
  train_bars: 4320
  test_bars: 2160
  step_bars: 2160
  metric: sharpe_ratio # sharpe_ratio | calmar_ratio | total_roi | sortino_ratio
  min_trades: 2
  initial_cash: 10000.0
  param_grid:
    strategy.trend_fast_window: [180, 240, 360]
    strategy.trend_slow_window: [600, 720, 960]
