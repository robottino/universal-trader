# Portafoglio Multi-Asset a 5 Strumenti su Bitfinex: BTC + ETH + Oro (XAUT) + Monero (XMR) + Solana (SOL)
#
# Validazione storica 2021–2026 ($25.000 iniziali, 0% fee spot Bitfinex + 2bps spread + 5bps slippage):
#   ROI Totale: +1.424,1% | CAGR: +58,7% | Sharpe: 1,43 | Calmar: 1,88 | MaxDD: 31,3% | ~12,6 trade/mese
#
# Strategia: EMA Trend 10d/30d (240h/720h, isteresi 1.5%) + Filtro Macro EMA 200d (4800h, isteresi 2.0%)
# Allocazione: Active Inverse-Volatility Risk Parity (cap 40% per singolo asset su 5 strumenti, max 98% investito)
# Dati: Candele 1h dirette da Bitfinex v2 API (nessuna API key richiesta per i dati storici/live)
#
# Utilizzo:
#   # Backtest storico 6 anni con grafico a 3 pannelli (portafoglio + B&H dei 5 asset + DD + allocazione):
#   uv run utrader backtest --config configs/bitfinex_portfolio_btc_eth_gold_xmr_sol.yaml --start 2021-01-01 --end 2026-11-25
#
#   # Simulazione a zero scritture su Bitfinex (legge solo prezzi/portafoglio):
#   uv run utrader trade --config configs/bitfinex_portfolio_btc_eth_gold_xmr_sol.yaml --dry-run
#
#   # Paper trading:
#   # - Con broker.type: bitfinex (paper: true), BTC/ETH/XAUT/SOL operano sui book Bitfinex Paper (tTEST...);
#   #   poiche' Bitfinex Paper non espone un book sintetico tTESTXMR, XMR viene quotato dal book live tXMRUSD
#   #   (usa broker.type: local_paper se desideri simulare localmente su SQLite anche gli eseguiti paper di XMR).
#   uv run utrader trade --config configs/bitfinex_portfolio_btc_eth_gold_xmr_sol.yaml
#
#   # Per passare a LIVE su Bitfinex (tBTCUSD, tETHUSD, tXAUT:USD, tXMRUSD, tSOLUSD — tutte attive e liquide):
#   # Imposta mode: live, broker.paper: false, e usa BITFINEX_LIVE_API_KEY / BITFINEX_LIVE_API_SECRET.

name: "bitfinex_portfolio_btc_eth_gold_xmr_sol"
mode: paper # dry_run | paper | live

instruments:
  - id: "BTC/USD"
    asset_class: crypto
    base: BTC
    quote_currency: USD
    calendar: "24/7"
    fractional: true
    min_qty: 0.00004   # verificato via Bitfinex pub:info:pair (BTCUSD)
    qty_step: 0.00001
    min_notional: 10.0
    provider_symbols:
      binance: "BTCUSDT"
      bitfinex: "tBTCUSD"
      bitfinex_paper: "tTESTBTC:TESTUSD"
      yahoo: "BTC-USD"

  - id: "ETH/USD"
    asset_class: crypto
    base: ETH
    quote_currency: USD
    calendar: "24/7"
    fractional: true
    min_qty: 0.0008    # verificato via Bitfinex pub:info:pair (ETHUSD)
    qty_step: 0.0001
    min_notional: 10.0
    provider_symbols:
      binance: "ETHUSDT"
      bitfinex: "tETHUSD"
      bitfinex_paper: "tTESTETH:TESTUSD"
      yahoo: "ETH-USD"

  - id: "XAUT/USD"
    asset_class: crypto
    base: XAUT
    quote_currency: USD
    calendar: "24/7"
    fractional: true
    min_qty: 0.002     # verificato via Bitfinex pub:info:pair (XAUT:USD)
    qty_step: 0.0001
    min_notional: 10.0
    provider_symbols:
      binance: "PAXGUSDT"
      bitfinex: "tXAUT:USD"
      bitfinex_paper: "tTESTXAUT:TESTUSD"
      yahoo: "GC=F"

  - id: "XMR/USD"
    asset_class: crypto
    base: XMR
    quote_currency: USD
    calendar: "24/7"
    fractional: true
    min_qty: 0.02      # verificato via Bitfinex pub:info:pair (XMRUSD)
    qty_step: 0.0001
    min_notional: 10.0
    provider_symbols:
      bitfinex: "tXMRUSD"
      yahoo: "XMR-USD"

  - id: "SOL/USD"
    asset_class: crypto
    base: SOL
    quote_currency: USD
    calendar: "24/7"
    fractional: true
    min_qty: 0.02      # verificato via Bitfinex pub:info:pair (SOLUSD / TESTSOL:TESTUSD)
    qty_step: 0.0001
    min_notional: 10.0
    provider_symbols:
      binance: "SOLUSDT"
      bitfinex: "tSOLUSD"
      bitfinex_paper: "tTESTSOL:TESTUSD"
      yahoo: "SOL-USD"

portfolio:
  allocation_method: inverse_volatility
  max_weight_per_asset: 0.40       # Cap riproporzionato per paniere a 5 asset (evita sovra-concentrazione alt)
  max_total_exposure: 0.98         # 2% cuscinetto cash USD
  vol_lookback_bars: 720           # volatilita' realizzata 30 giorni (30 * 24h)
  vol_min_bars: 24
  vol_floor: 0.10                  # pavimento volatilita' annualizzata 10%
  rebalance_band: 0.12             # ribilancia solo se scostamento >= 12% (riduce turnover)
  entry_min_weight: 0.05
  exit_weight_threshold: 0.01
  min_trade_notional: 25.0
  warmup_bars: 2880                # 120 giorni di warmup per convergenza EMA 200d
  benchmark_instrument_id: "BTC/USD"

data:
  provider: bitfinex               # Candele 1h 100% dirette da Bitfinex (copre nativamente anche XMR/USD)
  timeframe: "1h"
  lookback_bars: 7200              # 300 giorni di storia 1h (convergenza piena EMA 200d in live)
  price_column: close
  use_cache: true
  features:
    past_only: []
    known_future: []

forecaster:
  type: noop
  params:
    model_id: "noop/portfolio_ema_inv_vol"
    context_len: 720
    horizon: 1

strategy:
  # Regola identica su tutti i 5 asset (zero ritocchi per-asset -> anti-overfitting)
  type: ema_trend
  trend_fast_window: 240           # EMA 10 giorni (240h)
  trend_slow_window: 720           # EMA 30 giorni (720h)
  trend_hysteresis_pct: 0.015      # banda isteresi +/- 1.5%
  macro_ema_window: 4800           # Filtro macro EMA 200 giorni (4800h)
  macro_hysteresis_pct: 0.02       # isteresi macro +/- 2.0%
  macro_bear_weight: 0.0
  target_weight_bull: 0.98
  rebalance_band: 0.12

risk:
  enforce_market_hours: false
  max_data_age_minutes: 90
  max_exposure_pct: 0.98
  max_drawdown_pct: 0.40           # circuit breaker sopra il MaxDD storico del 31.3%
  cash_reserve_pct: 0.005          # 0.5% riserva sicurezza su market order
  fee_model:
    pct: 0.0                       # Bitfinex 0% maker/taker fee
    fixed_min: 0.0
  slippage_bps: 5.0
  spread_bps: 2.0
  enable_fee_guard: false

broker:
  type: bitfinex                   # usa "local_paper" per simulare localmente tutti e 5 gli asset su SQLite
  paper: true                      # true = Paper (tTEST...), false = Live (tBTCUSD, tETHUSD, tXAUT:USD, tXMRUSD, tSOLUSD)
  initial_cash: 25000.0
  execution_price: next_open
  api_key: "${BITFINEX_PAPER_API_KEY}"
  api_secret: "${BITFINEX_PAPER_API_SECRET}"

notifier:
  type: telegram
  enabled: true
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  notify_on: events                # events = solo movimenti/rifiuti/errori + 1 riepilogo a fine giornata | all = ogni ora
  daily_summary_hour_utc: 21       # riepilogo di fine giornata alle 21:00 UTC (22:00 CET / 23:00 CEST)
  template_path: "configs/templates/telegram_portfolio.html.j2"
  daily_template_path: "configs/templates/telegram_daily.html.j2"

storage:
  db_path: "state/bitfinex_portfolio.db"
