name: "btc_eur_1h_timestral"
mode: paper # dry_run | paper | live

instrument:
  id: "BTC/EUR"
  asset_class: crypto
  base: BTC
  quote_currency: EUR
  calendar: "24/7"
  fractional: true
  min_qty: 0.0001
  qty_step: 0.00001
  min_notional: 5.0
  provider_symbols:
    binance: "BTCEUR"
    bitfinex: "tTESTBTC:TESTEUR"
    yahoo: "BTC-EUR"

data:
  provider: binance
  timeframe: "1h"
  lookback_bars: 1024
  price_column: close
  features:
    past_only: ["volume", "log_return_1", "rolling_obi_24", "vix", "sp500"]
    known_future: ["hour_sin", "hour_cos", "dow_sin", "dow_cos"]

forecaster:
  type: timestral
  params:
    model_id: "mistralai/Timestral-123M"
    context_len: 512
    horizon: 24
    device: "auto" # auto | cuda | mps | cpu
    batch_size: 32

strategy:
  type: tail_risk_kelly
  signal: median_last
  theta_buy: 0.01
  theta_sell: -0.01
  k_risk: 0.5
  tail_quantile: 0.05

risk:
  enforce_market_hours: false
  max_data_age_minutes: 90
  max_exposure_pct: 1.0
  max_drawdown_pct: 0.15
  fee_model:
    pct: 0.001
    fixed_min: 0.0
  slippage_bps: 5.0

broker:
  type: bitfinex
  paper: true
  api_key: "${BITFINEX_PAPER_API_KEY}"
  api_secret: "${BITFINEX_PAPER_API_SECRET}"

notifier:
  type: telegram
  enabled: true
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
