[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "universal-trader"
version = "0.1.0"
description = "Modular, portable, asset-agnostic probabilistic forecasting, backtesting, walk-forward, and automated trading platform powered by Mistral Timestral."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "safetensors>=0.4",
    "timestral @ git+https://github.com/mistralai/timestral.git",
    "torch>=2.4",
    "typer>=0.12",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
alpaca = [
    "alpaca-py>=0.28",
]
ibkr = [
    "ib-async>=1.0",
]
cuda = []
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]
all = [
    "universal-trader[alpaca,ibkr,dev]",
]

[project.scripts]
utrader = "universal_trader.cli.app:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/universal_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: tests that download model weights or perform real ML inference",
    "network: tests that require external internet access",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["universal_trader"]
